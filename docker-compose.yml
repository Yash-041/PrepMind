# PrepMind in Docker: database (pgvector), backend (FastAPI) and frontend (nginx).
#   docker compose up -d --build   build and start everything -> http://localhost:5173
#   docker compose up -d db        database only (for start-dev.ps1 / local development)
#   docker compose logs -f backend watch backend logs
#   docker compose down            stop (data is kept in the prepmind_pgdata volume)
# Secrets stay in PrepMind/.env (POSTGRES_PASSWORD) and backend/.env (API keys etc.).
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: prepmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in PrepMind/.env}
      POSTGRES_DB: prepmind
    # Host port 5433 so it doesn't clash with a locally installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - prepmind_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prepmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prepmind-backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      # Inside Docker the database is the "db" service on its normal port.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/prepmind
    volumes:
      # Knowledge-base PDFs (read for question generation and ingestion) and the passage cache.
      - ./backend/data:/app/backend/data
    ports:
      - "8000:8000"   # API docs at http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: prepmind-frontend
    restart: unless-stopped
    # Port 5173 as in development, so Google sign-in and email links keep working.
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prepmind_pgdata:
