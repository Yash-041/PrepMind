server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tutor answers stream token by token (server-sent events): don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 20m;
    }

    # Built assets have hashed names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /exam, /auth/verify) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
